# Scaffolds every bundled template and builds + tests the result, so a
# broken template cannot be merged. The template list is read from the CLI
# itself (`new --list-templates --json`) rather than hardcoded here, so a
# newly added template is covered automatically.
name: scaffold-templates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: v28.0.0

jobs:
  build:
    name: build soroban-forge
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build soroban-forge
        run: cargo build --release --bin soroban-forge
      - name: List bundled templates
        id: list
        # `new --list-templates --json` is the CLI's own catalogue (see
        # crates/scaffold/src/lib.rs::available_templates) — the matrix below
        # fans out over whatever it reports, never a list maintained here.
        run: |
          templates=$(./target/release/soroban-forge new --list-templates --json | jq -c '.templates')
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soroban-forge-bin
          path: target/release/soroban-forge
          retention-days: 1

  scaffold-and-test:
    name: "template: ${{ matrix.template }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.build.outputs.templates) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Keyed per template: each scaffolded project's target/ dir is its
          # own cache entry instead of thrashing a single shared one.
          key: ${{ matrix.template }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soroban-forge-bin
          path: bin
      - name: Cache stellar-cli
        id: cache-stellar-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}
      - name: Install stellar-cli
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        # Official binary from stellar-cli releases, pinned to a specific
        # version. See: https://github.com/stellar/stellar-cli/releases
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION#v}-$(uname -m)-unknown-linux-gnu.tar.gz" \
            | tar xz -C ~/.local/bin stellar
          chmod +x ~/.local/bin/stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scaffold ${{ matrix.template }}
        run: |
          chmod +x bin/soroban-forge
          bin/soroban-forge new smoke --template ${{ matrix.template }} --no-git --output-dir "$RUNNER_TEMP"
      - name: cargo test
        working-directory: ${{ runner.temp }}/smoke
        run: cargo test
      - name: stellar contract build
        working-directory: ${{ runner.temp }}/smoke
        run: stellar contract build
