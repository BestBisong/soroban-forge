# Generated by `soroban-forge ci-init --provider bitbucket`.
# CI configuration for {{project_name}} — mirrors the GitHub build-test preset:
# runs the test suite and builds the contract wasm.

image: rust:latest

definitions:
  caches:
    cargo-registry: "~/.cargo/registry"
  steps:
    - step: &build-and-test
        name: "{{project_name}}: build & test"
        caches:
          - cargo-registry
        script:
          - rustup target add wasm32v1-none
          - cargo test
          - cargo build --target wasm32v1-none --release
        artifacts:
          - target/wasm32v1-none/release/{{crate_name}}.wasm

pipelines:
  default:
    - step: *build-and-test
  branches:
    main:
      - step: *build-and-test
  pull-requests:
    "**":
      - step: *build-and-test
