# Generated by `soroban-forge ci-init --provider circleci`.
# CircleCI configuration for {{project_name}}: build WASM and run tests.
version: 2.1

orbs:
  rust: circleci/rust@1.6.1

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.81.0
    resource_class: medium

jobs:
  build-and-test:
    executor: rust-executor
    steps:
      - checkout
      - run:
          name: Install wasm32v1-none target
          command: rustup target add wasm32v1-none
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "Cargo.lock" }}
            - cargo-v1-
      - run:
          name: Run tests
          command: cargo test
      - run:
          name: Build contract (wasm)
          command: cargo build --target wasm32v1-none --release
      - save_cache:
          key: cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target
      - store_artifacts:
          path: target/wasm32v1-none/release/{{crate_name}}.wasm
          destination: {{crate_name}}.wasm

workflows:
  build-test:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: /.*/
