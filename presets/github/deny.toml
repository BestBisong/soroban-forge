# cargo-deny configuration for {{project_name}}.
# Generated by `soroban-forge ci-init --security-scan`.
# See https://embarkstudios.github.io/cargo-deny/ for the full reference.

[advisories]
# Deny crates with known vulnerabilities from the RustSec advisory database.
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[licenses]
# Accept common permissive and copyleft licenses used in the Stellar ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
# Deny any license not in the allow-list.
unlicensed = "deny"
copyleft = "warn"

[bans]
# Fail if the same crate is pulled in at two different versions (helps with
# Soroban's strict dependency graph requirements).
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow crates from crates.io; remove or adjust for private registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
