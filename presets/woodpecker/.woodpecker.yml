# Generated by `soroban-forge ci-init --provider woodpecker`.
# Woodpecker CI configuration for {{project_name}} — mirrors the GitHub
# build-test preset: runs the test suite, builds the contract wasm, and
# lints with rustfmt + clippy.

when:
  event: [push, pull_request]

steps:
  build-and-test:
    image: rust:latest
    commands:
      - rustup target add wasm32v1-none
      - cargo test
      - cargo build --target wasm32v1-none --release

  lint:
    image: rust:latest
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --all-targets -- -D warnings