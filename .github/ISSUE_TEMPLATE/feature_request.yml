name: Feature request
description: Suggest a new command, flag or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Check [ISSUES.md](https://github.com/soroban-forge-labs/soroban-forge/blob/main/ISSUES.md)
        and existing issues first, since it may already be planned. The module you
        pick below is added as a `module:*` label automatically.
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of soroban-forge would this change? See the ownership map in CONTRIBUTING.md.
      options:
        - "module:core — CLI core, forge.toml, errors (crates/core, src/main.rs)"
        - "module:scaffold — `new`, templates (crates/scaffold, crates/templates, templates/)"
        - "module:testgen — `test-init` (crates/testgen)"
        - "module:ci — `ci-init`, CI presets (crates/ci-presets, presets/)"
        - "module:dx — `doctor`, docs, examples (crates/doctor, docs/, examples/)"
        - "module:bindings — `bindings ts` (crates/binding-ts)"
        - "module:verify — `verify` (crates/verify)"
        - "module:spec — `spec` (crates/spec)"
        - "module:deploy — `deploy` (crates/deploy)"
        - "module:invoke — `invoke` (crates/invoke)"
        - "module:identity — `identity` (crates/identity)"
        - "module:network — `network` (crates/network)"
        - "module:optimize — `optimize` (crates/optimize)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should soroban-forge do? Example commands and output help a lot.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches you ruled out.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/soroban-forge-labs/soroban-forge/blob/main/CODE_OF_CONDUCT.md).
          required: true
